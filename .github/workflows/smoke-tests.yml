# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CLI Smoke tests

on:
  [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .[dev]
    - name: Test CLI percentile
      run: |
        bash test/scripts/run-percentile.sh
    - name: Test CLI splitting - random
      run: |
        bash test/scripts/run-split.sh random
    - name: Test CLI splitting K-fold - random
      run: |
        bash test/scripts/run-split-k.sh random
    - name: Test CLI splitting - scaffold
      run: |
        bash test/scripts/run-split.sh scaffold
    - name: Test CLI splitting - FAISS
      run: |
        bash test/scripts/run-split.sh faiss
     - name: Test CLI multi-splitting 
      run: |
        bash test/scripts/run-split-multiway.sh
